spring.application.name=petcare
server.port=8080

# ---- Base de datos (ejecute antes database/veterinaria_petcare_v2.sql y 02_claves_demo.sql) ----
spring.datasource.url=jdbc:mysql://localhost:8090/veterinaria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.web.locale=es_CO

# ---- JWT (secreto de minimo 32 caracteres; cambielo en produccion) ----
app.jwt.secret=PetCare-Clave-Secreta-Para-JWT-2026-Cambiar-En-Produccion
app.jwt.expiration-ms=1800000
app.jwt.cookie-secure=false