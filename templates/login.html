<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body class="fondo-login">
<div class="container">
    <div class="row justify-content-center pt-5">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-3">
                        <img th:src="@{/img/logo.png}" class="logo-login" alt="PetCare Veterinaria">
                                                <p class="text-muted mb-0">Sistema de Gestión Médica e Inventario</p>
                    </div>
                    <div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
                    <div class="alert alert-success" th:if="${param.registrado}">Cuenta creada. Ya puede ingresar.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="form-group">
                            <label for="usuario">Usuario</label>
                            <input id="usuario" name="usuario" class="form-control" required autofocus>
                        </div>
                        <div class="form-group">
                            <label for="clave">Contraseña</label>
                            <input id="clave" type="password" name="clave" class="form-control" required>
                        </div>
                        <button class="btn btn-primary btn-block">Ingresar</button>
                    </form>
                    <hr>
                    <p class="text-center mb-0">¿Cliente nuevo? <a th:href="@{/registro}">Cree su cuenta</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
