<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
<div class="row justify-content-center"><div class="col-md-6"><div class="card">
<div class="card-header" th:text="${form.id == null} ? 'Nuevo usuario' : 'Editar usuario'"></div>
<div class="card-body">
<form th:action="@{/config/usuarios/guardar}" th:object="${form}" method="post">
    <div class="alert alert-danger" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
    <input type="hidden" th:field="*{id}">
    <div class="form-group"><label>Usuario</label>
        <input th:field="*{nombreUsuario}" class="form-control" th:classappend="${#fields.hasErrors('nombreUsuario')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{nombreUsuario}"></div></div>
    <div class="form-group"><label>Contraseña <small class="text-muted" th:if="${form.id != null}">(deje vacío para no cambiarla)</small></label>
        <input type="password" th:field="*{contrasena}" class="form-control"></div>
    <div class="form-group"><label>Grupo (rol)</label>
        <select th:field="*{rol}" class="form-control" th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid'">
            <option value="">-- Seleccione --</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
        </select>
        <div class="invalid-feedback" th:errors="*{rol}"></div></div>
    <div class="form-check mb-3"><input type="checkbox" th:field="*{estado}" class="form-check-input"><label class="form-check-label" for="estado1">Activo</label></div>
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" th:href="@{/config/usuarios}">Cancelar</a>
</form></div></div></div></div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
