<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Grupos de usuarios')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
<h3 class="mb-3">Grupos de usuarios (roles)</h3>
<div class="row">
    <div class="col-md-6 mb-3" th:each="g : ${grupos}">
        <div class="card h-100">
            <div class="card-header"><strong th:text="${g.key}"></strong>
                <span class="badge badge-primary float-right" th:text="${#lists.size(g.value)} + ' usuario(s)'"></span></div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item text-muted" th:if="${#lists.isEmpty(g.value)}">Sin usuarios</li>
                <li class="list-group-item" th:each="u : ${g.value}">
                    <span th:text="${u.nombreUsuario}"></span>
                    <span class="badge badge-secondary" th:if="${!u.estado}">Inactivo</span>
                </li>
            </ul>
        </div>
    </div>
</div>
<a class="btn btn-primary" th:href="@{/config/usuarios}">Administrar usuarios y asignar roles</a>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
