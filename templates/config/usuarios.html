<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Usuarios del sistema</h3>
    <a class="btn btn-success" th:href="@{/config/usuarios/nuevo}">+ Nuevo usuario</a>
</div>
<div class="table-responsive"><table class="table table-striped table-sm bg-white">
    <thead class="thead-dark"><tr><th>Usuario</th><th>Grupo (rol)</th><th>Estado</th><th></th></tr></thead>
    <tbody>
    <tr th:each="u : ${lista}">
        <td th:text="${u.nombreUsuario}"></td>
        <td><span class="badge badge-info" th:text="${u.rol}"></span></td>
        <td><span class="badge" th:classappend="${u.estado} ? 'badge-success' : 'badge-secondary'" th:text="${u.estado} ? 'Activo' : 'Inactivo'"></span></td>
        <td class="text-nowrap">
            <a class="btn btn-sm btn-primary" th:href="@{/config/usuarios/editar/{id}(id=${u.id})}">Editar</a>
            <form class="d-inline" th:action="@{/config/usuarios/eliminar/{id}(id=${u.id})}" method="post" onsubmit="return confirm('¿Eliminar este usuario?');">
                <button class="btn btn-sm btn-danger">Eliminar</button></form>
        </td>
    </tr>
    </tbody></table></div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
