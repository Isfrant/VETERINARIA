<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Nueva consulta')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
<div class="card"><div class="card-header">Registrar consulta médica</div><div class="card-body">
<form th:action="@{/veterinario/consultas/guardar}" method="post">
    <div class="form-row">
        <div class="form-group col-md-6"><label>Mascota (paciente)</label>
            <select name="mascotaId" class="form-control" required>
                <option value="">-- Seleccione --</option>
                <option th:each="m : ${mascotas}" th:value="${m.id}" th:selected="${m.id == mascotaSel}"
                        th:text="${m.nombre + ' - ' + m.especie + ' (' + m.propietario.nombre + ')'}"></option>
            </select></div>
        <div class="form-group col-md-6"><label>Cita aprobada asociada (opcional)</label>
            <select name="citaId" class="form-control">
                <option value="">-- Sin cita --</option>
                <option th:each="c : ${citas}" th:value="${c.id}" th:attr="data-mascota=${c.mascota.id}"
                        th:text="${#temporals.format(c.fecha,'dd/MM/yyyy') + ' ' + #temporals.format(c.hora,'HH:mm') + ' - ' + c.mascota.nombre}"></option>
            </select></div>
    </div>
    <div class="form-group"><label>Motivo de consulta</label><input name="motivo" class="form-control" required></div>
    <div class="form-group"><label>Diagnóstico</label><textarea name="diagnostico" class="form-control" rows="3"></textarea></div>
    <div class="form-group"><label>Tratamiento</label><textarea name="tratamiento" class="form-control" rows="3"></textarea></div>

    <h5 class="mt-4">Medicamentos e insumos utilizados</h5>
    <p class="text-muted small">Al guardar, el sistema valida las existencias y descuenta el stock automáticamente.</p>
    <div id="insumos">
        <div class="form-row fila-insumo mb-2">
            <div class="col-md-7"><select name="productoId" class="form-control">
                <option value="">-- Producto --</option>
                <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre + ' (stock: ' + p.stockActual + ')'}"></option>
            </select></div>
            <div class="col-md-3"><input type="number" name="cantidad" min="1" class="form-control" placeholder="Cantidad"></div>
            <div class="col-md-2"><button type="button" class="btn btn-outline-danger btn-block quitar">Quitar</button></div>
        </div>
    </div>
    <button type="button" id="agregar" class="btn btn-outline-primary btn-sm mb-3">+ Agregar insumo</button>
    <div>
        <button class="btn btn-primary">Guardar consulta</button>
        <a class="btn btn-secondary" th:href="@{/veterinario/consultas}">Cancelar</a>
    </div>
</form></div></div>
<script>
    var selMascota = document.querySelector('select[name=mascotaId]');
    var selCita = document.querySelector('select[name=citaId]');
    // Muestra solo las citas de la mascota elegida (si no hay mascota elegida, muestra todas)
    function filtrarCitas() {
        var m = selMascota.value;
        Array.prototype.forEach.call(selCita.options, function (o) {
            if (!o.value) return;
            var ok = (m === '' || o.getAttribute('data-mascota') === m);
            o.hidden = !ok;
            o.disabled = !ok;
        });
        var actual = selCita.options[selCita.selectedIndex];
        if (actual && actual.disabled) selCita.value = '';
    }
    selMascota.addEventListener('change', filtrarCitas);
    // Al elegir una cita, se selecciona automáticamente su mascota
    selCita.addEventListener('change', function () {
        var o = selCita.options[selCita.selectedIndex];
        if (o && o.value) { selMascota.value = o.getAttribute('data-mascota'); filtrarCitas(); }
    });
    filtrarCitas();
    document.getElementById('agregar').addEventListener('click', function () {
        var cont = document.getElementById('insumos');
        var copia = cont.querySelector('.fila-insumo').cloneNode(true);
        copia.querySelector('select').value = '';
        copia.querySelector('input').value = '';
        cont.appendChild(copia);
    });
    document.getElementById('insumos').addEventListener('click', function (e) {
        if (e.target.classList.contains('quitar')) {
            var filas = this.querySelectorAll('.fila-insumo');
            if (filas.length > 1) e.target.closest('.fila-insumo').remove();
        }
    });
</script>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
