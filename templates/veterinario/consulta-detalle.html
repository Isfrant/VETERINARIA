<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Detalle de consulta')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
<div class="card"><div class="card-header">
    Consulta del <span th:text="${#temporals.format(h.fecha,'dd/MM/yyyy')}"></span> —
    <strong th:text="${h.mascota.nombre}"></strong></div>
<div class="card-body">
    <p><strong>Propietario:</strong> <span th:text="${h.mascota.propietario.nombre}"></span></p>
    <p><strong>Veterinario:</strong> <span th:text="${h.veterinario.nombre}"></span></p>
    <p><strong>Motivo:</strong> <span th:text="${h.motivo}"></span></p>
    <p><strong>Diagnóstico:</strong><br><span th:text="${h.diagnostico}"></span></p>
    <p><strong>Tratamiento:</strong><br><span th:text="${h.tratamiento}"></span></p>
    <h6>Insumos utilizados</h6>
    <table class="table table-sm w-50">
        <thead><tr><th>Producto</th><th>Cantidad</th></tr></thead>
        <tbody>
            <tr th:each="d : ${h.detalles}"><td th:text="${d.producto.nombre}"></td><td th:text="${d.cantidadUtilizada}"></td></tr>
            <tr th:if="${#lists.isEmpty(h.detalles)}"><td colspan="2" class="text-muted">Sin insumos</td></tr>
        </tbody>
    </table>
    <a class="btn btn-secondary" th:href="@{/veterinario/consultas}">Volver</a>
</div></div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
