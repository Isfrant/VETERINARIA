<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Historial clínico')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Historial clínico</h3>
    <a class="btn btn-success" th:href="@{/veterinario/consultas/nueva}">+ Nueva consulta</a>
</div>
<form class="form-inline mb-3" th:action="@{/veterinario/consultas}" method="get">
    <label class="mr-2">Mascota:</label>
    <select name="mascotaId" class="form-control mr-2" onchange="this.form.submit()">
        <option value="">Todas</option>
        <option th:each="m : ${mascotas}" th:value="${m.id}" th:selected="${m.id == mascotaSel}"
                th:text="${m.nombre + ' (' + m.propietario.nombre + ')'}"></option>
    </select>
</form>
<div class="table-responsive"><table class="table table-striped table-sm bg-white">
    <thead class="thead-dark"><tr><th>Fecha</th><th>Mascota</th><th>Motivo</th><th>Diagnóstico</th><th>Veterinario</th><th></th></tr></thead>
    <tbody>
    <tr th:each="h : ${lista}">
        <td th:text="${#temporals.format(h.fecha,'dd/MM/yyyy')}"></td>
        <td th:text="${h.mascota.nombre}"></td><td th:text="${h.motivo}"></td>
        <td th:text="${h.diagnostico}"></td><td th:text="${h.veterinario.nombre}"></td>
        <td><a class="btn btn-sm btn-primary" th:href="@{/veterinario/consultas/{id}(id=${h.id})}">Ver</a></td>
    </tr>
    <tr th:if="${#lists.isEmpty(lista)}"><td colspan="6" class="text-center text-muted">Sin consultas</td></tr>
    </tbody></table></div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
