<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cambiar contraseña')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
    <div class="row justify-content-center"><div class="col-md-6">
        <div class="card"><div class="card-header">Cambiar contraseña</div>
        <div class="card-body">
            <form th:action="@{/contrasena}" method="post">
                <div class="form-group"><label>Contraseña actual</label><input type="password" name="actual" class="form-control" required></div>
                <div class="form-group"><label>Nueva contraseña (mínimo 6 caracteres)</label><input type="password" name="nueva" class="form-control" minlength="6" required></div>
                <div class="form-group"><label>Confirmar nueva contraseña</label><input type="password" name="confirmacion" class="form-control" minlength="6" required></div>
                <button class="btn btn-primary">Actualizar</button>
            </form>
        </div></div>
    </div></div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
