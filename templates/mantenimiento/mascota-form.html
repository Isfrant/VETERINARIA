<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Mascota')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
<div class="row justify-content-center"><div class="col-md-7"><div class="card">
<div class="card-header" th:text="${mascota.id == null} ? 'Nueva mascota' : 'Editar mascota'"></div>
<div class="card-body">
<form th:action="@{/mantenimiento/mascotas/guardar}" th:object="${mascota}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="form-group"><label>Propietario</label>
        <select name="propietario.id" class="form-control" required>
            <option value="">-- Seleccione --</option>
            <option th:each="p : ${propietarios}" th:value="${p.id}"
                    th:text="${p.documento + ' - ' + p.nombre}"
                    th:selected="${mascota.propietario != null and mascota.propietario.id == p.id}"></option>
        </select></div>
    <div class="form-group"><label>Nombre</label>
        <input th:field="*{nombre}" class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{nombre}"></div></div>
    <div class="form-row">
        <div class="form-group col-md-5"><label>Especie</label>
            <input th:field="*{especie}" class="form-control" list="especies" th:classappend="${#fields.hasErrors('especie')} ? 'is-invalid'">
            <datalist id="especies"><option value="Perro"><option value="Gato"><option value="Ave"><option value="Conejo"></datalist>
            <div class="invalid-feedback" th:errors="*{especie}"></div></div>
        <div class="form-group col-md-5"><label>Raza</label><input th:field="*{raza}" class="form-control"></div>
        <div class="form-group col-md-2"><label>Edad</label>
            <input type="number" min="0" th:field="*{edad}" class="form-control" th:classappend="${#fields.hasErrors('edad')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{edad}"></div></div>
    </div>
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" th:href="@{/mantenimiento/mascotas}">Cancelar</a>
</form></div></div></div></div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
