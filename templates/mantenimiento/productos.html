<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Inventario de productos</h3>
    <a class="btn btn-success" th:href="@{/mantenimiento/productos/nuevo}">+ Nuevo producto</a>
</div>
<div class="table-responsive"><table class="table table-sm bg-white">
    <thead class="thead-dark"><tr><th>Producto</th><th>Stock</th><th>Mínimo</th><th>Precio</th><th>Estado</th><th></th></tr></thead>
    <tbody>
    <tr th:each="p : ${lista}" th:classappend="${p.activo and p.stockBajo} ? 'table-danger'">
        <td th:text="${p.nombre}"></td>
        <td><strong th:text="${p.stockActual}"></strong></td>
        <td th:text="${p.stockMinimo}"></td>
        <td th:text="${#numbers.formatDecimal(p.precioUnitario,1,'POINT',0,'COMMA')}"></td>
        <td>
            <span class="badge badge-secondary" th:if="${!p.activo}">Inactivo</span>
            <span class="badge badge-danger" th:if="${p.activo and p.stockBajo}">⚠ Stock bajo</span>
            <span class="badge badge-success" th:if="${p.activo and !p.stockBajo}">Normal</span>
        </td>
        <td class="text-nowrap">
            <a class="btn btn-sm btn-primary" th:href="@{/mantenimiento/productos/editar/{id}(id=${p.id})}">Editar</a>
            <form class="d-inline" th:action="@{/mantenimiento/productos/eliminar/{id}(id=${p.id})}" method="post" onsubmit="return confirm('¿Eliminar este producto?');">
                <button class="btn btn-sm btn-danger">Eliminar</button></form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(lista)}"><td colspan="6" class="text-center text-muted">Sin registros</td></tr>
    </tbody></table></div>
<small class="text-muted">Si un producto ya fue usado en consultas no se puede eliminar: edítelo y desmarque «Activo».</small>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
