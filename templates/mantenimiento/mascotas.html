<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Mascotas')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Mascotas / Pacientes</h3>
    <a class="btn btn-success" th:href="@{/mantenimiento/mascotas/nuevo}">+ Nueva mascota</a>
</div>
<form class="form-inline mb-3" th:action="@{/mantenimiento/mascotas}" method="get">
    <input class="form-control mr-2" name="q" th:value="${q}" placeholder="Cédula del dueño o nombre de la mascota">
    <button class="btn btn-outline-primary">Buscar</button>
</form>
<div class="table-responsive"><table class="table table-sm bg-white">
    <thead class="thead-dark"><tr><th>Nombre</th><th>Especie</th><th>Raza</th><th>Edad</th><th>Propietario</th><th>Documento</th>
        <th sec:authorize="hasRole('ADMINISTRADOR')">Estado</th><th></th></tr></thead>
    <tbody>
    <tr th:each="m : ${lista}" th:classappend="${!m.activo} ? 'table-secondary text-muted'">
        <td th:text="${m.nombre}"></td><td th:text="${m.especie}"></td><td th:text="${m.raza}"></td><td th:text="${m.edad}"></td>
        <td th:text="${m.propietario.nombre}"></td><td th:text="${m.propietario.documento}"></td>
        <td sec:authorize="hasRole('ADMINISTRADOR')">
            <span class="badge badge-success" th:if="${m.activo}">Activa</span>
            <span class="badge badge-secondary" th:unless="${m.activo}">Oculta</span>
        </td>
        <td class="text-nowrap">
            <a class="btn btn-sm btn-primary" th:if="${m.activo}" th:href="@{/mantenimiento/mascotas/editar/{id}(id=${m.id})}">Editar</a>
            <form class="d-inline" th:if="${m.activo}" th:action="@{/mantenimiento/mascotas/eliminar/{id}(id=${m.id})}" method="post"
                  onsubmit="return confirm('La mascota quedará oculta y se eliminarán sus citas. Su historial médico se conserva. ¿Continuar?');">
                <button class="btn btn-sm btn-danger">Eliminar</button></form>
            <form class="d-inline" th:unless="${m.activo}" sec:authorize="hasRole('ADMINISTRADOR')"
                  th:action="@{/mantenimiento/mascotas/reactivar/{id}(id=${m.id})}" method="post">
                <button class="btn btn-sm btn-success">Reactivar</button></form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(lista)}"><td colspan="8" class="text-center text-muted">Sin registros</td></tr>
    </tbody></table></div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
