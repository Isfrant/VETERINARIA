<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Veterinarios')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container contenido mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Veterinarios</h3>
    <a class="btn btn-success" th:href="@{/mantenimiento/veterinarios/nuevo}">+ Nuevo veterinario</a>
</div>
<div class="table-responsive"><table class="table table-striped table-sm bg-white">
    <thead class="thead-dark"><tr><th>Documento</th><th>Nombre</th><th>Teléfono</th><th>Email</th><th>Usuario</th><th></th></tr></thead>
    <tbody>
    <tr th:each="v : ${lista}">
        <td th:text="${v.documento}"></td><td th:text="${v.nombre}"></td><td th:text="${v.telefono}"></td><td th:text="${v.email}"></td>
        <td th:text="${v.usuario != null} ? ${v.usuario.nombreUsuario} : '—'"></td>
        <td class="text-nowrap">
            <a class="btn btn-sm btn-primary" th:href="@{/mantenimiento/veterinarios/editar/{id}(id=${v.id})}">Editar</a>
            <form class="d-inline" th:action="@{/mantenimiento/veterinarios/eliminar/{id}(id=${v.id})}" method="post" onsubmit="return confirm('¿Eliminar este veterinario?');">
                <button class="btn btn-sm btn-danger">Eliminar</button></form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(lista)}"><td colspan="6" class="text-center text-muted">Sin registros</td></tr>
    </tbody></table></div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
